# Weekly Instagram maintenance: refresh token, sync images, deploy.
# Keeps the feed autonomous — no manual npm commands for Béatrice.
#
# Required GitHub repository secrets:
#   INSTAGRAM_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   GH_PAT — fine-grained PAT with repo Secrets: write (updates token after refresh)
# Optional: INSTAGRAM_USER_ID

name: Instagram maintenance

on:
  schedule:
    # Every day 04:00 UTC (localize new posts before CDN URLs expire)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          missing=0
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::error::Missing secret INSTAGRAM_ACCESS_TOKEN"
            missing=1
          else
            echo "INSTAGRAM_ACCESS_TOKEN is set (${#INSTAGRAM_ACCESS_TOKEN} chars)"
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Instagram token
        id: refresh
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/refresh-instagram-token.mjs --github-output

      - name: Resolve active token
        id: token
        env:
          REFRESHED: ${{ steps.refresh.outputs.access_token }}
          FALLBACK: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -n "$REFRESHED" ]; then
            echo "Using refreshed Instagram token"
            echo "access_token<<IG_TOKEN_EOF" >> "$GITHUB_OUTPUT"
            echo "$REFRESHED" >> "$GITHUB_OUTPUT"
            echo "IG_TOKEN_EOF" >> "$GITHUB_OUTPUT"
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Token refresh skipped/failed — using existing INSTAGRAM_ACCESS_TOKEN secret"
            echo "access_token<<IG_TOKEN_EOF" >> "$GITHUB_OUTPUT"
            echo "$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "IG_TOKEN_EOF" >> "$GITHUB_OUTPUT"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Cloudflare Instagram secret
        if: steps.token.outputs.refreshed == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          printf '%s' "$TOKEN" | npx wrangler secret put INSTAGRAM_ACCESS_TOKEN

      - name: Update GitHub Instagram secret
        if: steps.token.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not configured — skipping GitHub secret update."
            echo "Add GH_PAT (repo Secrets write) so the refreshed token stays in sync for CI."
            exit 0
          fi
          printf '%s' "$TOKEN" | gh secret set INSTAGRAM_ACCESS_TOKEN --repo "${{ github.repository }}"

      - name: Sync Instagram feed
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_SYNC_STRICT: "1"
        run: npm run instagram:sync

      - name: Commit synced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/instagram-feed.json public/instagram/
          if git diff --staged --quiet; then
            echo "No Instagram asset changes to commit."
          else
            git commit -m "chore: sync Instagram feed [automated]"
            git push
          fi

      - name: Deploy to Cloudflare
        run: npm run deploy
